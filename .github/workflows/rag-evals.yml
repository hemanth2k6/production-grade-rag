name: RAG Evaluation and Deployment

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
          
      - name: Run Data Ingestion
        run: |
          PYTHONPATH=. python scripts/ingest.py

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. pytest tests/ -v
          
      - name: Run Ragas Offline Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Faithfulness threshold is hardcoded to 0.75 in the eval script.
          # We chose 0.75 as it provides a solid baseline indicating the LLM 
          # strictly relies on context without aggressively hallucinating, while
          # allowing a small margin of error for LLM evaluator fuzziness.
          PYTHONPATH=. python evals/run_evals.py

  deploy:
    name: Deploy to Render
    needs: test-and-evaluate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -X POST $RENDER_DEPLOY_HOOK
